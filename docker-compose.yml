version: '3.8'

services:
  bot:
    build: .
    container_name: zibonsathi-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ZIBONSATHI_API_URL=${ZIBONSATHI_API_URL}
      - ZIBONSATHI_API_KEY=${ZIBONSATHI_API_KEY}
    # No ports needed - bot uses polling